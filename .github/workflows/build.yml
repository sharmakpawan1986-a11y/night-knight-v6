name: Build NIGH-KNIGHT V6

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q gradle-8.2.1-bin.zip
          echo "$PWD/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Verify project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/leo/nighknight/GameView.java

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Locate APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGH-KNIGHT-V6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
